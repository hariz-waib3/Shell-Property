# Netlify: builds the Vue client and runs the demo API as a Netlify Function (client/netlify/functions).
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Vue Router handles every other path (e.g. /admin/properties/12).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
